spring:
  datasource:
    url: jdbc:h2:mem:prettynails;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  # Disable mail auto-configuration for local development (uses EmailServiceMock)
  mail:
    host: localhost
    port: 2525
    username: mock
    password: mock
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

bucket4j:
  cache:
    config:
      type: caffeine

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars-for-hs256}
  expiration: 2592000000

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: +639000000000
  upload:
    dir: uploads
    max-file-size: 5242880
    base-url: http://localhost:8080
  email:
    verification-url: http://localhost:3000/verify-email
    reset-url: http://localhost:3000/reset-password
    from-email: noreply@prettynails.local
  rate-limit:
    auth:
      requests-per-minute: 10
      requests-per-hour: 100
  password-policy:
    min-length: 8
    min-zxcvbn-score: 1
    hibp-check-enabled: false
    history-size: 5
  cookie:
    secure: false