spring:
  datasource:
    url: jdbc:h2:mem:prettynails;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
      path: /h2-console
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m
  # Disable mail auto-configuration for local development (uses EmailServiceMock)
  mail:
    host: localhost
    port: 2525
    username: mock
    password: mock
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # OAuth2 Client configuration for local (optional - uses env vars)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
            authorization-grant-type: authorization_code
            client-name: Google
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:}
            client-secret: ${FACEBOOK_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - public_profile
            authorization-grant-type: authorization_code
            client-name: Facebook
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/v18.0/me?fields=id,name,email,picture
            user-name-attribute: id

bucket4j:
  cache:
    config:
      type: caffeine

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars-for-hs256}
  expiration: 2592000000

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: +639000000000
  upload:
    dir: uploads
    max-file-size: 5242880
    base-url: http://localhost:8080
  email:
    verification-url: http://localhost:3000/verify-email
    reset-url: http://localhost:3000/reset-password
    from-email: noreply@prettynails.local
  rate-limit:
    auth:
      requests-per-minute: 10
      requests-per-hour: 100
  password-policy:
    min-length: 8
    min-zxcvbn-score: 1
    hibp-check-enabled: false
    history-size: 5
  cookie:
    secure: false