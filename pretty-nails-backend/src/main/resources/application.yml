spring:
  application:
    name: prettynails-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Configure JVM default timezone for the studio (Asia/Manila)
  jackson:
    timezone: Asia/Manila

  datasource:
    url: jdbc:postgresql://localhost:5432/prettynails
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema from JPA"

  sql:
    init:
      mode: never

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-min-32-chars-for-hs256}
  expiration: ${JWT_EXPIRATION:2592000000}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: http://localhost:3000
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: "+639000000000"
  upload:
    dir: uploads
    max-file-size: 5242880
    base-url: ""
  email:
    from-email: ${SENDGRID_FROM_EMAIL:noreply@prettynails.example.com}
    verification-url: http://localhost:3000/verify-email
    reset-url: http://localhost:3000/reset-password
  rate-limit:
    auth:
      requests-per-minute: 10
      requests-per-hour: 100
  password-policy:
    min-length: 8
    min-zxcvbn-score: 1
    history-size: 5
    hibp-check-enabled: true
    hibp-api-url: https://api.pwnedpasswords.com/range/
  cookie:
    secure: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    oauth:
      use-pkce-with-authorization-code-grant: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.prettynails.controller

logging:
  level:
    com.prettynails: DEBUG