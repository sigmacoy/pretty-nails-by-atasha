spring:
  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema from JPA"
  sql:
    init:
      mode: never
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.test.autoconfigure.jdbc.TestDatabaseAutoConfiguration
  mail:
    host: localhost
    port: 25
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

jwt:
  secret: cHJldHR5bmFpbHMtc2VjcmV0LWtleS1mb3Itand0LXRva2VuLWdlbmVyYXRpb24tbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25n
  expiration: 2592000000

app:
  cors:
    allowed-origins: http://localhost:3000
  admin:
    email: admin
    password: admin
    phone: "+639000000000"
  upload:
    dir: uploads
    max-file-size: 5242880
    base-url: ""
  email:
    verification-url: http://localhost:3000/verify-email
    reset-url: http://localhost:3000/reset-password
    from-email: noreply@prettynails.example.com
  rate-limit:
    auth:
      requests-per-minute: 10
      requests-per-hour: 100

logging:
  level:
    com.prettynails: DEBUG
    org.testcontainers: INFO
    org.hibernate.SQL: DEBUG